<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딴길 지도 - 목적지가 아닌 길을 발견하는 지도</title>

    <style>
        /* 기본 화면 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 왼쪽 검색 영역과 오른쪽 지도 영역 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 사이드바 패널 */
        .sidebar {
            width: 380px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-right: 1px solid #e5e5e5;
            z-index: 2;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #eeeeee;
        }

        .header h1 {
            margin: 0 0 6px;
            font-size: 22px;
            color: #1a1a1a;
        }

        .header p {
            margin: 0 0 16px;
            color: #777;
            font-size: 13px;
        }

        /* 탭 버튼 영역 */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 10px 0;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #f8f9fa;
            color: #555;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-button:hover {
            background: #f0f0f0;
        }

        .tab-button.active {
            background: #fee500;
            border-color: #f5d900;
            color: #222;
        }

        /* 검색창과 검색 버튼 */
        .search-form {
            display: flex;
            gap: 8px;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #f4c542;
        }

        #searchButton {
            padding: 0 14px;
            border: none;
            border-radius: 8px;
            background: #fee500;
            color: #222;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background: #f5d900;
        }

        #searchButton:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        /* 현재 위치 버튼 */
        .location-button {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
            color: #333;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .location-button:hover {
            background: #f0f0f0;
        }

        /* 상태 안내 문구 */
        #status {
            padding: 12px 20px 8px;
            color: #666;
            font-size: 12px;
            line-height: 1.4;
            border-bottom: 1px solid #f5f5f5;
        }

        /* 검색 결과 목록 */
        #resultList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-item {
            padding: 16px 20px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
            transition: background 0.15s;
        }

        .result-item:hover,
        .result-item.active {
            background: #fffbea;
        }

        .place-name {
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
            color: #222;
        }

        .place-category {
            margin-bottom: 6px;
            color: #777;
            font-size: 12px;
        }

        .place-address {
            color: #555;
            font-size: 12px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .place-phone {
            margin-top: 6px;
            color: #888;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #2868c7;
            font-size: 12px;
            text-decoration: none;
        }

        .place-link:hover {
            text-decoration: underline;
        }

        .empty-message {
            padding: 30px 20px;
            color: #888;
            font-size: 14px;
            text-align: center;
            line-height: 1.7;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #f2f2f2;
        }

        /* 반응형 스타일 */
        @media (max-width: 600px) {
            .sidebar {
                width: 45%;
                min-width: 160px;
            }

            .header {
                padding: 14px 10px;
            }

            .header h1 {
                font-size: 16px;
            }

            .header p {
                font-size: 11px;
                margin-bottom: 10px;
            }

            .tab-button {
                padding: 8px 0;
                font-size: 11px;
            }

            #searchInput {
                padding: 8px 6px;
                font-size: 12px;
            }

            #searchButton {
                padding: 0 8px;
                font-size: 12px;
            }

            #status {
                padding: 8px 10px;
            }

            .result-item {
                padding: 12px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 검색창, 탭 및 결과 목록 -->
        <aside class="sidebar">
            <header class="header">
                <h1>딴길 지도</h1>
                <p>목적지가 아닌 주변의 길을 발견해보세요.</p>

                <!-- 구체적 지시: 탭 버튼 2개 (문화시설 / 공원) -->
                <div class="tab-container">
                    <button id="tabCulture" class="tab-button" type="button">
                        문화시설 (CT1)
                    </button>
                    <button id="tabPark" class="tab-button" type="button">
                        공원
                    </button>
                </div>

                <!-- 키워드 직접 검색 폼 -->
                <form id="searchForm" class="search-form">
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="장소 또는 키워드 입력..."
                        aria-label="검색할 장소"
                    >
                    <button id="searchButton" type="submit">
                        검색
                    </button>
                </form>

                <!-- 현재 위치 버튼 -->
                <button
                    id="locationButton"
                    class="location-button"
                    type="button"
                >
                    📍 현재 위치로 이동
                </button>
            </header>

            <div id="status" role="status" aria-live="polite">
                지도를 불러오는 중입니다...
            </div>

            <ul id="resultList">
                <li class="empty-message">
                    지도 로딩이 완료되면 장소를 검색하거나 탭을 눌러보세요.
                </li>
            </ul>
        </aside>

        <!-- 오른쪽: 카카오맵 -->
        <main id="map" aria-label="장소 검색 지도"></main>

    </div>

    <script>
        // 카카오 JavaScript SDK 앱 키
        const kakaoKey = "c659b02ed675ee6b9809da12d67e55a4";

        // HTML 요소 참조
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const locationButton = document.getElementById("locationButton");
        const tabCulture = document.getElementById("tabCulture");
        const tabPark = document.getElementById("tabPark");
        const resultList = document.getElementById("resultList");
        const statusText = document.getElementById("status");

        // 지도 및 검색 상태 변수
        let map = null;
        let placesService = null;
        let infoWindow = null;
        let markers = [];
        let currentLocation = null;
        let currentLocationMarker = null;
        let isMapReady = false;
        let searchRequestId = 0;
        let currentTab = null; // 'CT1' | 'PARK' | null

        // 상태 메시지 표시
        function setStatus(message) {
            statusText.textContent = message;
        }

        // 결과 리스트 초기화
        function clearResults(message) {
            resultList.replaceChildren();

            if (message) {
                const item = document.createElement("li");
                item.className = "empty-message";
                item.textContent = message;
                resultList.appendChild(item);
            }
        }

        // 지도 마커 전체 제거
        function clearMarkers() {
            markers.forEach(function (marker) {
                marker.setMap(null);
            });
            markers = [];

            if (infoWindow) {
                infoWindow.close();
            }
        }

        // SDK 로딩 오류 처리
        function handleSdkError() {
            setStatus("카카오맵 SDK를 불러오지 못했습니다.");
            clearResults("앱 키 및 웹 도메인 설정을 확인해 주세요.");
            searchButton.disabled = true;
            locationButton.disabled = true;
            tabCulture.disabled = true;
            tabPark.disabled = true;
        }

        // 카카오 SDK 로드 완료 콜백
        function onKakaoSdkLoad() {
            if (!window.kakao || !window.kakao.maps) {
                handleSdkError();
                return;
            }

            kakao.maps.load(function () {
                try {
                    initializeMap();
                } catch (error) {
                    console.error("지도 초기화 에러:", error);
                    handleSdkError();
                }
            });
        }

        // 지도 초기화
        function initializeMap() {
            const defaultPosition = new kakao.maps.LatLng(37.566826, 126.9786567); // 서울시청 기본값
            const mapContainer = document.getElementById("map");

            map = new kakao.maps.Map(mapContainer, {
                center: currentLocation || defaultPosition,
                level: 5 // 지도 확대 레벨 5
            });

            placesService = new kakao.maps.services.Places(map);
            infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });

            isMapReady = true;

            setStatus("지도 준비 완료. 원하는 탭을 선택해보세요.");
            clearResults("상단 탭을 누르거나 검색어를 입력하세요.");

            // 현재 위치 확인 시작
            requestCurrentLocation();

            // 브라우저 리사이즈 시 지도 비율 재조정
            window.addEventListener("resize", function () {
                if (map) {
                    map.relayout();
                    if (currentLocation) {
                        map.setCenter(currentLocation);
                    }
                }
            });
        }

        // 현재 위치 (GPS) 가져오기
        function requestCurrentLocation() {
            if (!navigator.geolocation) {
                setStatus("이 브라우저는 위치 정보를 지원하지 않습니다.");
                return;
            }

            setStatus("현재 위치를 확인하고 있습니다...");

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    currentLocation = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    if (isMapReady && map) {
                        map.setCenter(currentLocation);
                        showCurrentLocationMarker();
                    }

                    setStatus("현재 위치가 설정되었습니다.");
                },
                function (error) {
                    console.warn("위치 권한 오류:", error.code);
                    setStatus("위치 정보를 가져올 수 없어 기본 위치로 설정됩니다.");
                },
                {
                    enableHighAccuracy: false,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 현재 위치 표시 파란색 마커
        function showCurrentLocationMarker() {
            if (!map || !currentLocation) return;

            if (currentLocationMarker) {
                currentLocationMarker.setMap(null);
            }

            currentLocationMarker = new kakao.maps.Marker({
                map: map,
                position: currentLocation,
                title: "현재 위치"
            });
        }

        // 탭 상태 업데이트
        function setActiveTab(tabType) {
            currentTab = tabType;
            tabCulture.classList.toggle("active", tabType === "CT1");
            tabPark.classList.toggle("active", tabType === "PARK");
        }

        // 탭 1: 카테고리 CT1 (문화시설) 검색
        tabCulture.addEventListener("click", function () {
            setActiveTab("CT1");
            searchInput.value = "";
            searchByCategory("CT1", "주변 문화시설");
        });

        // 탭 2: 키워드 '공원' 검색
        tabPark.addEventListener("click", function () {
            setActiveTab("PARK");
            searchInput.value = "";
            searchByKeyword("공원", "주변 공원");
        });

        // 카테고리 코드 기반 주변 검색 (CT1 - 문화시설)
        function searchByCategory(categoryCode, categoryName) {
            if (!isMapReady || !placesService) return;

            const requestId = ++searchRequestId;
            setStatus("내 위치 주변 " + categoryName + " 탐색 중...");
            clearResults("검색 결과를 불러오고 있습니다...");
            clearMarkers();

            const searchCenter = currentLocation || map.getCenter();

            placesService.categorySearch(
                categoryCode,
                function (data, status) {
                    if (requestId !== searchRequestId) return;

                    if (status === kakao.maps.services.Status.OK) {
                        displayPlaces(data);
                        setStatus("내 위치 주변 " + categoryName + " " + data.length + "곳을 발견했습니다.");
                    } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                        clearResults("주변에 " + categoryName + "이(가) 없습니다.");
                        setStatus("검색 결과가 없습니다.");
                    } else {
                        clearResults("검색 중 오류가 발생했습니다.");
                        setStatus("검색 오류가 발생했습니다.");
                    }
                },
                {
                    location: searchCenter,
                    radius: 3000, // 반경 3km 내 탐색
                    sort: kakao.maps.services.SortBy.DISTANCE
                }
            );
        }

        // 키워드 기반 주변 검색 ('공원' 등)
        function searchByKeyword(keyword, titleLabel) {
            if (!isMapReady || !placesService) return;

            const requestId = ++searchRequestId;
            setStatus("내 위치 주변 " + (titleLabel || keyword) + " 탐색 중...");
            clearResults("검색 결과를 불러오고 있습니다...");
            clearMarkers();

            const searchCenter = currentLocation || map.getCenter();

            placesService.keywordSearch(
                keyword,
                function (data, status) {
                    if (requestId !== searchRequestId) return;

                    if (status === kakao.maps.services.Status.OK) {
                        displayPlaces(data);
                        setStatus("내 위치 주변 " + keyword + " " + data.length + "곳을 발견했습니다.");
                    } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                        clearResults("주변에 검색 결과가 없습니다.");
                        setStatus("검색 결과가 없습니다.");
                    } else {
                        clearResults("검색 중 오류가 발생했습니다.");
                        setStatus("검색 오류가 발생했습니다.");
                    }
                },
                {
                    location: searchCenter,
                    radius: 3000,
                    sort: kakao.maps.services.SortBy.DISTANCE
                }
            );
        }

        // 사용자 직접 검색 폼 제출
        searchForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const keyword = searchInput.value.trim();

            if (!keyword) {
                setStatus("검색어를 입력해 주세요.");
                return;
            }

            setActiveTab(null); // 탭 해제
            searchByKeyword(keyword, "'" + keyword + "'");
        });

        // 검색된 장소 목록 및 지도 마커 표시
        function displayPlaces(places) {
            clearResults("");
            clearMarkers();

            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(place.y, place.x);
                bounds.extend(position);

                // 지도 마커 생성
                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: place.place_name
                });

                markers.push(marker);

                // 마커 클릭 이벤트
                kakao.maps.event.addListener(marker, "click", function () {
                    selectPlace(place, marker, index);
                });

                // 사이드바 목록 아이템 생성
                const item = document.createElement("li");
                item.className = "result-item";

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = place.place_name;

                const category = document.createElement("div");
                category.className = "place-category";
                category.textContent = place.category_name || "분류 없음";

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent = place.road_address_name || place.address_name || "주소 정보 없음";

                item.append(name, category, address);

                if (place.phone) {
                    const phone = document.createElement("div");
                    phone.className = "place-phone";
                    phone.textContent = place.phone;
                    item.appendChild(phone);
                }

                if (place.place_url) {
                    const link = document.createElement("a");
                    link.className = "place-link";
                    link.href = place.place_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "카카오맵에서 열기";
                    link.addEventListener("click", function (e) {
                        e.stopPropagation();
                    });
                    item.appendChild(link);
                }

                // 리스트 항목 클릭 이벤트
                item.addEventListener("click", function () {
                    selectPlace(place, marker, index);
                });

                resultList.appendChild(item);
            });

            // 검색 결과 위치로 지도 범위를 맞춤
            if (places.length > 0) {
                map.setBounds(bounds, 50, 50, 50, 50);
            }
        }

        // 특정 장소 선택 시 마커 팝업(인포윈도우) 표시 및 지도 이동
        function selectPlace(place, marker, index) {
            const position = new kakao.maps.LatLng(place.y, place.x);
            map.panTo(position);

            // 리스트 하이라이트
            const items = document.querySelectorAll(".result-item");
            items.forEach(function (el) { el.classList.remove("active"); });

            if (items[index]) {
                items[index].classList.add("active");
                items[index].scrollIntoView({ behavior: "smooth", block: "nearest" });
            }

            // 인포윈도우 팝업 내용 (이름 + 주소)
            const content = document.createElement("div");
            content.style.cssText = "padding:12px;font-size:13px;line-height:1.4;max-width:220px;";

            const title = document.createElement("strong");
            title.style.cssText = "display:block;margin-bottom:6px;font-size:14px;color:#222;";
            title.textContent = place.place_name;

            const addr = document.createElement("div");
            addr.style.cssText = "color:#666;font-size:12px;word-break:keep-all;";
            addr.textContent = place.road_address_name || place.address_name || "주소 없음";

            content.append(title, addr);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // 현재 위치 버튼 클릭
        locationButton.addEventListener("click", function () {
            requestCurrentLocation();
        });

        // SDK 스크립트 에러 감지
        window.addEventListener("error", function (event) {
            if (
                event.target &&
                event.target.tagName === "SCRIPT" &&
                event.target.src &&
                event.target.src.includes("dapi.kakao.com")
            ) {
                handleSdkError();
            }
        }, true);
    </script>

    <!-- 카카오맵 SDK -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c659b02ed675ee6b9809da12d67e55a4&libraries=services&autoload=false"
        async
        onload="onKakaoSdkLoad()"
        onerror="handleSdkError()">
    </script>
</body>
</html>
